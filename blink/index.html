  #track { height: 3px; margin-top: -6px; }

  #big { font-size: 56px; font-weight: 700; line-height: 1; }
  #rows { margin: 0; font: inherit; font-size: 20px; line-height: 1.6; white-space: pre; text-align: left; }
  #btns { display: flex; gap: 10px; justify-content: center; }
  button {
    font: inherit; font-weight: 600; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 11px 24px; cursor: pointer;
  }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

      { name: 'pirate ship', d: ['M10 66 L90 66 L76 86 L24 86 Z', 'M36 66 L36 16', 'M64 66 L64 24', 'M36 20 L36 54 L18 54 Q18 34 36 20 Z', 'M64 28 L64 56 L46 56 Q46 40 64 28 Z', 'M36 16 L36 6 L48 11 Z', 'M4 94 Q12 89 20 94 T36 94 T52 94 T68 94 T84 94 T100 94'] },
      { name: 'piano keys', d: ['M6 36 L94 36 L94 86 L6 86 Z', 'M6 50 L94 50', 'M28 50 L28 86', 'M50 50 L50 86', 'M72 50 L72 86', B(14, 50, 6, 20), B(25, 50, 6, 20), B(47, 50, 6, 20), B(58, 50, 6, 20), B(69, 50, 6, 20)] },
      { name: 'tractor', d: [O(68, 70, 20), O(68, 70, 4), O(24, 78, 12), O(24, 78, 3), 'M10 62 L10 42 L44 42 L48 24 L70 24 L72 52', 'M20 42 L20 28', 'M52 24 L52 40', 'M4 90 L96 90'] },
      { name: 'spider web', d: ['M50 6 L50 94', 'M6 50 L94 50', 'M19 19 L81 81', 'M81 19 L19 81', 'M64 50 L59.9 59.9 L50 64 L40.1 59.9 L36 50 L40.1 40.1 L50 36 L59.9 40.1 Z', 'M78 50 L69.8 69.8 L50 78 L30.2 69.8 L22 50 L30.2 30.2 L50 22 L69.8 30.2 Z', 'M92 50 L79.7 79.7 L50 92 L20.3 79.7 L8 50 L20.3 20.3 L50 8 L79.7 20.3 Z'] },
      { name: 'tree swing', d: ['M42 92 L44 50', 'M58 92 L56 50', 'M30 56 Q4 52 10 30 Q6 10 30 12 Q44 0 60 10 Q92 6 90 30 Q98 52 70 56 Q56 60 44 56 Z', 'M72 54 L72 76', 'M84 54 L84 76', 'M68 76 L88 76 L88 80 L68 80 Z', 'M0 92 L100 92'] },
      { name: 'bookshelf', d: ['M14 10 L86 10 L86 92 L14 92 Z', 'M14 36 L86 36', 'M14 62 L86 62', 'M20 36 L20 18 L28 18 L28 36', 'M30 36 L30 14 L38 14 L38 36', 'M42 36 L42 20 L52 20 L52 36', 'M62 36 L62 22 L68 22 L68 36', 'M20 62 L20 42 L30 42 L30 62', 'M60 62 L60 44 L66 44 L66 62', 'M30 92 L30 70 L40 70 L40 92', 'M46 92 L46 74 L52 74 L52 92'] },
      { name: 'Eiffel tower', d: ['M50 6 L40 40 L34 92', 'M50 6 L60 40 L66 92', 'M44 24 L56 24', 'M40 40 L60 40', 'M37 60 L63 60', 'M28 92 L72 92', 'M36 80 Q50 62 64 80', 'M40 40 L63 60', 'M60 40 L37 60'] },
      { name: 'pyramids', d: ['M4 86 L38 30 L72 86 Z', 'M50 86 L72 48 L96 86', 'M12 72 L64 72', 'M22 58 L54 58', O(84, 18, 8), 'M0 86 L100 86'] },
      { name: 'volcano', d: ['M10 92 L40 30 L60 30 L90 92', 'M40 30 Q50 38 60 30', 'M46 36 L44 58 L50 52 L52 78', 'M50 26 Q40 18 48 10 Q58 4 64 14', 'M30 22 L24 14', 'M72 22 L78 14', 'M4 92 L96 92'] },
      { name: 'bus', d: ['M8 30 L84 30 L92 50 L92 72 L8 72 Z', B(14, 36, 14, 14), B(32, 36, 14, 14), B(50, 36, 14, 14), 'M68 36 L68 50 L80 50 L76 36 Z', O(26, 74, 9), O(72, 74, 9), 'M8 58 L92 58', 'M86 62 L90 62'] },
      { name: 'sunflower', d: [O(50, 36, 12), O(72, 36, 7), O(65.6, 51.6, 7), O(50, 58, 7), O(34.4, 51.6, 7), O(28, 36, 7), O(34.4, 20.4, 7), O(50, 14, 7), O(65.6, 20.4, 7), 'M50 65 Q54 82 50 98', 'M52 80 Q68 70 78 78 Q66 90 52 80 Z'] },
      { name: 'fish tank', d: [B(10, 24, 80, 60), 'M10 36 L90 36', 'M26 56 Q36 46 46 56 Q36 66 26 56 Z', 'M46 56 L54 48 L54 64 Z', 'M76 84 Q70 70 78 60', 'M76 84 Q84 70 80 56', O(34, 44, 2), O(40, 38, 2.5), 'M10 78 L90 78'] },
      { name: 'pancakes', d: [E(50, 46, 28, 8), 'M22 46 L20 56 Q20 64 50 64 Q80 64 80 56 L78 46', 'M20 56 L18 66 Q18 74 50 74 Q82 74 82 66 L80 56', 'M8 76 Q8 92 50 92 Q92 92 92 76', B(42, 30, 16, 9)] },
      { name: 'treasure chest', d: ['M12 50 L12 88 L88 88 L88 50 Z', 'M12 50 Q12 20 50 20 Q88 20 88 50', B(44, 44, 12, 14), O(50, 50, 2), 'M30 25 L30 88', 'M70 25 L70 88'] },
      { name: 'monster', d: ['M16 90 Q10 40 50 20 Q90 40 84 90 Z', O(50, 50, 14), O(50, 50, 5), 'M34 74 L40 68 L46 76 L52 68 L58 76 L64 68 L66 74', 'M30 28 L24 12 L38 22', 'M70 28 L76 12 L62 22', 'M16 70 L4 60', 'M84 70 L96 60'] },
      { name: 'wizard hat', d: [E(50, 78, 42, 10), 'M24 76 Q36 40 54 8 Q60 40 76 76', 'M30 66 Q50 72 70 66', 'M46 36 L46 44 M42 40 L50 40', 'M60 56 L60 62 M57 59 L63 59'] }
    ]
  };

  // ───────── helpers ─────────
  function $(id) { return document.getElementById(id); }
  function dayNumber() {
    var t = new Date();
    var days = Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - EPOCH) / 864e5);
    return Math.max(1, days + 1);
  }
  function pick(n, i) {
    var k = DIFFS[i].k, pool = POOLS[k];
    return pool[((n - 1) + OFFSET[k]) % pool.length];
  }
  function paths(it) {
    if (!it.paths) it.paths = it.d.map(function (s) { return new Path2D(s); });
    return it.paths;
  }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function sq(s) { var f = Math.round(s / 20); return '🟩'.repeat(f) + '⬜'.repeat(5 - f); }
  function avg(a) { return Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length); }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  // ───────── scoring ─────────
  var oc = document.createElement('canvas'); oc.width = oc.height = R;
  var octx = oc.getContext('2d', { willReadFrequently: true });

  function mask(draw, lw) {
    octx.clearRect(0, 0, R, R);
    octx.lineWidth = lw; octx.lineCap = 'round'; octx.lineJoin = 'round'; octx.strokeStyle = '#000';
    draw(octx);
    var d = octx.getImageData(0, 0, R, R).data, m = new Uint8Array(R * R);
    for (var i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 60 ? 1 : 0;
    return m;
  }
  function strokeUser(c, strokes, dx, dy) {
    strokes.forEach(function (s) {
      if (!s.length) return;
      c.beginPath();
      s.forEach(function (p, i) {
        var x = p[0] * R + dx, y = p[1] * R + dy;
        if (i) c.lineTo(x, y); else c.moveTo(x, y);
      });
      if (s.length === 1) c.lineTo(s[0][0] * R + dx + 0.01, s[0][1] * R + dy);
      c.stroke();
    });
  }
  function doodleMasks(it) {
    if (!it.thin) {
      var dr = function (c) { paths(it).forEach(function (p) { c.stroke(p); }); };
      it.thin = mask(dr, THIN); it.thick = mask(dr, THICK);
      var x0 = R, x1 = 0, y0 = R, y1 = 0;
      for (var i = 0; i < it.thin.length; i++) if (it.thin[i]) {
        var x = i % R, y = (i / R) | 0;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      it.cx = (x0 + x1) / 2; it.cy = (y0 + y1) / 2;
    }
    return it;
  }
  function overlap(a, b) {            // share of a's pixels that land on b
    var n = 0, h = 0;
    for (var i = 0; i < a.length; i++) if (a[i]) { n++; if (b[i]) h++; }
    return n ? h / n : 0;
  }
  function fScore(it, strokes, dx, dy) {
    var dr = function (c) { strokeUser(c, strokes, dx, dy); };
    var ut = mask(dr, THIN), uk = mask(dr, THICK);
    var rec = overlap(it.thin, uk);   // how much of the doodle you covered
    var pre = overlap(ut, it.thick);  // how much of your drawing is on the doodle
    return rec + pre ? 2 * rec * pre / (rec + pre) : 0;
  }
  function scoreDrawing(it, strokes) {
    var pts = [];
    strokes.forEach(function (s) { s.forEach(function (p) { pts.push(p); }); });
    if (!pts.length) return { score: 0, dx: 0, dy: 0, F: 0 };
    doodleMasks(it);
    var x0 = 1, x1 = 0, y0 = 1, y1 = 0;
    pts.forEach(function (p) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    });
    // try as-drawn, and re-centred on the doodle (forgives a whole drawing sitting off to one side)
    var cands = [[0, 0], [it.cx - (x0 + x1) / 2 * R, it.cy - (y0 + y1) / 2 * R]];
    var best = { F: -1 };
    cands.forEach(function (c) {
      var F = fScore(it, strokes, c[0], c[1]);
      if (F > best.F) best = { F: F, dx: c[0], dy: c[1] };
    });
    var x = Math.min(1, Math.max(0, (best.F - F0) / (F1 - F0)));
    return { score: Math.round(100 * x), dx: best.dx, dy: best.dy, F: best.F };
  }

  // ───────── state ─────────
  // testing helpers: ?reset clears saved progress, ?day=N plays day N using separate storage
  var qs = new URLSearchParams(location.search);
  var testDay = parseInt(qs.get('day'), 10);
  if (qs.has('reset')) { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':test'); } catch (e) {} }
  if (testDay > 0) KEY += ':test';
  if (qs.has('reset')) { try { history.replaceState(null, '', location.pathname + (testDay > 0 ? '?day=' + testDay : '')); } catch (e) {} }
  var n = testDay > 0 ? testDay : dayNumber();
  var store = load();
  var scores = (store.day === n && Array.isArray(store.scores)) ? store.scores.slice(0, 3) : [];
  var streak = store.streak || 0, lastDay = store.lastDay || 0;
  var S = { phase: 'intro', it: null, strokes: [], cur: null, pid: null, t0: 0, dx: 0, dy: 0 };
  var raf = 0, tmo = 0, tick = 0;

  var wrap = $('wrap'), canvas = $('c'), ctx = canvas.getContext('2d');
  var track = $('track'), bar = $('bar');
  var size = 0;

  function persist() { save({ day: n, scores: scores, streak: streak, lastDay: lastDay }); }
  function stopTimers() { cancelAnimationFrame(raf); clearTimeout(tmo); clearInterval(tick); }

  // ───────── canvas ─────────
  function fit() {
    if (wrap.hidden) return;
    size = wrap.clientWidth;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function redraw() {
    if (wrap.hidden || !size) return;
    ctx.clearRect(0, 0, size, size);
    if (S.phase === 'flash') paintDoodle(css('--text'), 1);
    else if (S.phase === 'draw') paintUser(css('--accent'), 0, 0);
    else if (S.phase === 'reveal') { paintDoodle(css('--text'), 0.55); paintUser(css('--accent'), S.dx, S.dy); }
  }
  function paintDoodle(color, alpha) {
    ctx.save(); ctx.scale(size / R, size / R);
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    paths(S.it).forEach(function (p) { ctx.stroke(p); });
    ctx.restore();
  }
  function paintUser(color, dx, dy) {
    ctx.save(); ctx.scale(size / R, size / R);
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokeUser(ctx, S.strokes, dx, dy);
    ctx.restore();
  }
  function setBar(frac, show) {
    bar.style.opacity = show ? 1 : 0;
    bar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, frac)) + ')';
  }

  // ───────── ui ─────────
  function ui(o) {
    $('num').textContent = '#' + n;
    $('sub').textContent = o.sub || '';
    $('big').textContent = o.big || '';
    $('rows').textContent = o.rows || '';
    $('rows').hidden = !o.rows;
    $('note').textContent = o.note || '';
    wrap.hidden = !o.canvas;
    track.hidden = !o.canvas;
    var b = $('btns'); b.innerHTML = '';
    (o.btns || []).forEach(function (x) {
      var el = document.createElement('button');
      el.textContent = x.label; if (x.primary) el.className = 'primary';
      if (x.id) el.id = x.id;
      el.addEventListener('click', function () { x.fn(el); });
      b.appendChild(el);
    });
    if (o.canvas) fit();
  }

  function intro() {
    stopTimers(); S.phase = 'intro';
    var i = scores.length;
    ui({
      sub: i ? 'Round ' + (i + 1) + ' of 3 · ' + DIFFS[i].k + ' · ' + DIFFS[i].sec + ' seconds'
             : 'Look at a doodle, then redraw it from memory.',
      note: i ? '' : '3 rounds · 3s, 5s, 7s',
      btns: [{ label: 'Start', primary: true, fn: startRound }]
    });
  }

  function startRound() {
    stopTimers();
    var i = scores.length;
    S.it = pick(n, i); S.strokes = []; S.cur = null; S.t0 = 0; S.phase = 'flash';
    ui({ sub: (i + 1) + '/3 · ' + DIFFS[i].sec + 's', canvas: true });
    setBar(1, false);
    tmo = setTimeout(function () {
      var t0 = performance.now(), dur = DIFFS[i].sec * 1000;
      setBar(1, true); redraw();
      (function step(t) {
        var left = 1 - (t - t0) / dur;
        if (left <= 0) return beginDraw();
        setBar(left, true);
        raf = requestAnimationFrame(step);
      })(t0);
    }, 400);
  }

  function beginDraw() {
    cancelAnimationFrame(raf);
    S.phase = 'draw'; S.strokes = []; S.t0 = 0;
    ui({
      sub: 'Draw it. 30s starts on your first stroke.', canvas: true,
      btns: [
        { label: 'Undo', id: 'undo', fn: function () { S.strokes.pop(); redraw(); buttons(); } },
        { label: 'Done', id: 'done', primary: true, fn: submit }
      ]
    });
    setBar(1, true); buttons();
  }
  function buttons() {
    var u = $('undo'), d = $('done');
    if (u) u.disabled = !S.strokes.length;
    if (d) d.disabled = !S.strokes.length;
  }
  function drawLoop(t) {
    var left = DRAW_MS - (t - S.t0);
    if (left <= 0) return submit();
    setBar(left / DRAW_MS, true);
    raf = requestAnimationFrame(drawLoop);
  }

  function pt(e) {
    var r = canvas.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
            Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (S.phase !== 'draw' || S.cur) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    S.pid = e.pointerId; S.cur = [pt(e)]; S.strokes.push(S.cur);
    if (!S.t0) { S.t0 = performance.now(); raf = requestAnimationFrame(drawLoop); }
    redraw(); buttons();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (S.phase !== 'draw' || !S.cur || e.pointerId !== S.pid) return;
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!evs.length) evs = [e];
    evs.forEach(function (ev) { S.cur.push(pt(ev)); });
    redraw();
  });
  function endStroke(e) { if (e.pointerId === S.pid) S.cur = null; }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  window.addEventListener('resize', fit);

  function submit() {
    if (S.phase !== 'draw') return;
    cancelAnimationFrame(raf); S.cur = null;
    S.phase = 'reveal';
    var r = scoreDrawing(S.it, S.strokes);
    S.dx = r.dx; S.dy = r.dy;
    var i = scores.length;
    scores.push(r.score);
    var last = scores.length === 3;
    if (last) { streak = lastDay === n - 1 ? streak + 1 : 1; lastDay = n; }
    persist();
    ui({
      canvas: true,
      sub: 'That was a ' + S.it.name + '.',
      big: r.score + '%',
      rows: DIFFS[i].dot + ' ' + sq(r.score),
      note: last ? '' : 'Next: ' + DIFFS[i + 1].k + ' · ' + DIFFS[i + 1].sec + 's',
      btns: [{ label: last ? 'Results' : 'Next', primary: true, fn: last ? results : startRound }]
    });
    setBar(0, false);
  }

  function shareText() {
    var lines = ['Blink #' + n + ' · ' + avg(scores) + '%'];
    scores.forEach(function (s, i) { lines.push(DIFFS[i].dot + ' ' + sq(s) + ' ' + s); });
    lines.push('happytatoes.com/blink');
    return lines.join('\n');
  }
  function copy(btn) {
    var t = shareText();
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove(); done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback);
    else fallback();
  }
  function untilMidnight() {
    var t = new Date(), next = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    var m = Math.max(1, Math.ceil((next - t) / 60000)), h = Math.floor(m / 60);
    return (h ? h + 'h ' : '') + (m % 60) + 'm';
  }
  function results() {
    stopTimers(); S.phase = 'done';
    var rows = scores.map(function (s, i) { return DIFFS[i].dot + ' ' + sq(s) + ' ' + ('   ' + s).slice(-3).replace(/ /g, '\u2007'); }).join('\n');
    var note = function () { return 'Streak ' + streak + ' · next Blink in ' + untilMidnight(); };
    ui({
      big: avg(scores) + '%', rows: rows, note: note(),
      btns: [{ label: 'Copy', primary: true, fn: copy }]
    });
    tick = setInterval(function () { $('note').textContent = note(); }, 30000);
  }

  if (scores.length >= 3) results(); else intro();
})();
</script>
